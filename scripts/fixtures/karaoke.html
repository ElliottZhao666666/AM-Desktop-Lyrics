<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>AMDL 歌词渲染回归</title>
<style>body{margin:0;background:#4b4b4b;color:#fff;font-family:system-ui}main{padding:30px}header{display:flex;gap:20px;align-items:center}section{padding:28px 20px;margin:20px 0;background:#555}label{font-size:14px;color:#ddd}.amdl-lyrics{line-height:1.5}input{width:300px}</style>
<style id="amdl-runtime-theme"></style></head><body><main><header><h2>整行渐变与字形遮罩</h2><select id="preset"></select><input id="position" type="range" min="0" max="20000" value="9500" step="1"><output id="time">9500</output><button id="pause">切换暂停缩放</button></header><div id="app"></div></main>
<script type="module">
import {createApp,h,ref} from 'vue';
import KaraokeLine from '/src/components/KaraokeLine.vue';
import {DEFAULT_EDITOR,PRESETS,buildThemeCss} from '/src/theme.ts';
const position=ref(9500),paused=ref(false);
const makeLine=(tokens,step)=>({text:tokens.join(''),begin_ms:0,end_ms:tokens.length*step,words:tokens.map((text,index)=>({text,begin_ms:index*step,end_ms:(index+1)*step}))});
const lines=[['中文',makeLine(Array.from('忘记我们承诺 忘记曾经爱你爱得那么浓'),600)],['English',makeLine(['We ','remember ','every ','promise ','and ','every ','ordinary ','day.'],2200)],['换行与空格',makeLine(['The ','extraordinarily ','long ','words ','and ','different ','character ','widths ','should ','share ','one ','continuous ','gradient.'],900)]];
document.querySelector('#amdl-runtime-theme').textContent=buildThemeCss(DEFAULT_EDITOR);
const select=document.querySelector('#preset');
PRESETS.forEach(preset=>select.add(new Option(preset.name,preset.id)));
select.addEventListener('change',()=>{document.querySelector('#amdl-runtime-theme').textContent=buildThemeCss(PRESETS.find(p=>p.id===select.value).editor)});
document.querySelector('#position').addEventListener('input',event=>{position.value=Number(event.target.value);document.querySelector('#time').textContent=String(position.value)});
document.querySelector('#pause').addEventListener('click',()=>{paused.value=!paused.value});
createApp({render(){return h('div',lines.map(([label,line],index)=>h('section',{'data-case':index},[h('label',label),h('div',{class:'amdl-lyrics',style:{transform:paused.value?'scale(.95)':'none',transformOrigin:'center'}},[h(KaraokeLine,{line,positionMs:position.value})])])));}}).mount('#app');
</script></body></html>
